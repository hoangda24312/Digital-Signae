<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #wrap{position:fixed;inset:0;overflow:hidden;background:#000}
  /* kéo iframe lớn hơn khung ~60px mỗi đầu để cắt mất thanh tiêu đề (trên) và thanh dưới của YouTube */
  #player{position:absolute;left:0;width:100%;top:-60px;height:calc(100% + 120px);border:0;pointer-events:none}
  /* lớp chắn trong suốt: chạm / rê chuột không tới được player nên không bật giao diện pause, prev/next */
  #shield{position:fixed;inset:0;z-index:10}
</style>
</head>
<body>
<div id="wrap"><div id="player"></div></div>
<div id="shield"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const q    = new URLSearchParams(location.search);
  const id   = q.get("v");
  const loop = q.get("loop") === "1";          // app báo: chỉ có 1 nội dung thì tự phát lại
  const wrap = document.getElementById("wrap");

  // Báo cho app Flet bằng cách đổi #hash (app bắt qua WebView.on_url_change). Thêm số để lần nào cũng là URL mới.
  function signal(tag) { location.hash = tag + "-" + Date.now(); }

  function onYouTubeIframeAPIReady() {
    if (!/^[A-Za-z0-9_-]{11}$/.test(id || "")) { signal("error"); return; }
    new YT.Player("player", {
      videoId: id,
      playerVars: {
        autoplay: 1, mute: 1, controls: 0, disablekb: 1, fs: 0, rel: 0,
        modestbranding: 1, iv_load_policy: 3, cc_load_policy: 0,
        playsinline: 1, enablejsapi: 1, origin: location.origin
        // KHÔNG dùng loop=1&playlist=... : nó biến video thành "playlist" nên hiện nút prev/next
      },
      events: {
        onReady: e => { e.target.mute(); e.target.playVideo(); },
        onStateChange: e => {
          if (e.data === YT.PlayerState.ENDED) {
            if (loop) { e.target.seekTo(0); e.target.playVideo(); }
            else { wrap.style.visibility = "hidden"; signal("ended"); }   // giấu luôn màn hình "video gợi ý"
          }
          if (e.data === YT.PlayerState.PAUSED) e.target.playVideo();     // lỡ bị pause thì phát tiếp
        },
        onError: () => signal("error")
      }
    });
  }
</script>
</body>
</html>
